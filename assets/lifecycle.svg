<svg xmlns="http://www.w3.org/2000/svg" width="980" height="220" viewBox="0 0 980 220" role="img" aria-labelledby="title desc"><title id="title">A development work unit</title><desc id="desc">Scope, implement, gates, review, deliver, handoff. Scripts own state and evidence; skills own judgment.</desc><rect width="980" height="220" rx="20" fill="#f5f2ec"/><g font-family="system-ui, sans-serif"><text x="28" y="44" font-size="22" font-weight="700" fill="#17232e">One unit. Explicit acceptance.</text><rect x="28" y="80" width="135" height="64" rx="12" fill="#223342"/><text x="95.5" y="118" text-anchor="middle" fill="#ffffff" font-size="17">Scope</text><path d="M168 112h10m-4-4 4 4-4 4" fill="none" stroke="#98a8b6" stroke-width="2"/><rect x="183" y="80" width="135" height="64" rx="12" fill="#223342"/><text x="250.5" y="118" text-anchor="middle" fill="#ffffff" font-size="17">Implement</text><path d="M323 112h10m-4-4 4 4-4 4" fill="none" stroke="#98a8b6" stroke-width="2"/><rect x="338" y="80" width="135" height="64" rx="12" fill="#c0392b"/><text x="405.5" y="118" text-anchor="middle" fill="#ffffff" font-size="17">Gates</text><path d="M478 112h10m-4-4 4 4-4 4" fill="none" stroke="#98a8b6" stroke-width="2"/><rect x="493" y="80" width="135" height="64" rx="12" fill="#223342"/><text x="560.5" y="118" text-anchor="middle" fill="#ffffff" font-size="17">Review</text><path d="M633 112h10m-4-4 4 4-4 4" fill="none" stroke="#98a8b6" stroke-width="2"/><rect x="648" y="80" width="135" height="64" rx="12" fill="#223342"/><text x="715.5" y="118" text-anchor="middle" fill="#ffffff" font-size="17">Deliver</text><path d="M788 112h10m-4-4 4 4-4 4" fill="none" stroke="#98a8b6" stroke-width="2"/><rect x="803" y="80" width="135" height="64" rx="12" fill="#223342"/><text x="870.5" y="118" text-anchor="middle" fill="#ffffff" font-size="17">Handoff</text><text x="28" y="186" font-size="15" fill="#45596a">Scripts: state + evidence + effects</text><text x="566" y="186" font-size="15" fill="#45596a">Skills: scope + implementation + judgment</text></g></svg>
